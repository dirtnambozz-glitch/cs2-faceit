<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
    <defs>
        <linearGradient id="bladeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF6B00"/>
            <stop offset="50%" stop-color="#FF5500"/>
            <stop offset="100%" stop-color="#D94000"/>
        </linearGradient>
        <linearGradient id="bladeAmber" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FF8A00"/>
            <stop offset="100%" stop-color="#FFA826"/>
        </linearGradient>
        <linearGradient id="bladeDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E2638"/>
            <stop offset="100%" stop-color="#0E121B"/>
        </linearGradient>
        <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="60%" stop-color="#CBD5E1"/>
            <stop offset="100%" stop-color="#64748B"/>
        </linearGradient>
        <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF5500" flood-opacity="0.5"/>
        </filter>
        <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
    </defs>

    <!-- Outer Tactical Hexagon Frame -->
    <polygon points="100,12 176,56 176,144 100,188 24,144 24,56" fill="url(#bladeDark)" stroke="#222C3E" stroke-width="3" filter="url(#glowSubtle)"/>
    
    <!-- Inner Accent Micro-lines -->
    <polygon points="100,24 164,62 164,138 100,176 36,138 36,62" fill="none" stroke="#2D3A52" stroke-width="1.5" stroke-dasharray="8 4"/>

    <!-- Left Geometric Blade (Metallic Silver / Titanium) -->
    <path d="M54 70 L96 34 L96 118 L64 146 L54 136 Z" fill="url(#metalSilver)"/>
    <path d="M64 146 L96 118 L96 156 L76 166 Z" fill="#475569"/>

    <!-- Right Intersecting Cyber Blade (FACEIT Radiant Orange) -->
    <path d="M146 70 L104 34 L104 126 L136 154 L146 144 Z" fill="url(#bladeOrange)" filter="url(#glowOrange)"/>
    <path d="M104 74 L146 70 L126 128 L104 104 Z" fill="url(#bladeAmber)"/>
    <path d="M136 154 L104 126 L104 164 L124 174 Z" fill="#B33600"/>

    <!-- Center Precision Slit / Core Gem -->
    <polygon points="100,44 108,100 100,148 92,100" fill="#0C0E14"/>
    <polygon points="100,72 105,98 100,120 95,98" fill="#FF5500"/>
    <circle cx="100" cy="98" r="3" fill="#FFFFFF"/>
</svg>
