<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
    <defs>
        <radialGradient id="botBg" cx="50%" cy="35%" r="75%">
            <stop offset="0%" stop-color="#1E1E2C"/>
            <stop offset="60%" stop-color="#0F0F17"/>
            <stop offset="100%" stop-color="#07070B"/>
        </radialGradient>
        <linearGradient id="botMetal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4B5563"/>
            <stop offset="50%" stop-color="#1F2937"/>
            <stop offset="100%" stop-color="#111827"/>
        </linearGradient>
        <linearGradient id="botCoreOrange" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFA026"/>
            <stop offset="50%" stop-color="#FF5500"/>
            <stop offset="100%" stop-color="#B33600"/>
        </linearGradient>
        <filter id="botEyeGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FF5500" flood-opacity="0.9"/>
        </filter>
    </defs>

    <!-- Canvas -->
    <rect width="240" height="240" rx="36" fill="url(#botBg)"/>
    <rect x="2" y="2" width="236" height="236" rx="34" fill="none" stroke="#2B2D42" stroke-width="2.5"/>
    <rect x="8" y="8" width="224" height="224" rx="28" fill="none" stroke="#FF5500" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 6"/>

    <!-- Combat Robot Chassis Head -->
    <g>
        <!-- Neck Post -->
        <rect x="96" y="160" width="48" height="40" rx="4" fill="#111827" stroke="#374151" stroke-width="2"/>
        <line x1="104" y1="172" x2="136" y2="172" stroke="#FF5500" stroke-width="2"/>
        <line x1="104" y1="184" x2="136" y2="184" stroke="#374151" stroke-width="2"/>

        <!-- Shoulders / Torso -->
        <path d="M40 240 L56 200 L96 186 L144 186 L184 200 L200 240 Z" fill="#151922" stroke="#2C3549" stroke-width="2"/>
        <path d="M102 200 L138 200 L130 240 L110 240 Z" fill="#0D1117"/>

        <!-- Main Head Geometry (Angular Combat Chassis) -->
        <polygon points="68,64 120,32 172,64 164,136 120,166 76,136" fill="url(#botMetal)" stroke="#374151" stroke-width="2"/>
        <polygon points="84,72 120,50 156,72 150,128 120,150 90,128" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>

        <!-- Forehead Insignia / Decal -->
        <polygon points="112,54 128,54 124,68 116,68" fill="#FF5500"/>
        <text x="120" y="80" fill="#9CA3AF" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="bold" text-anchor="middle" letter-spacing="2">TRAINING BOT // 01</text>

        <!-- Eye Visor Slit -->
        <path d="M86 94 L154 94 L146 112 L94 112 Z" fill="#090C10" stroke="#1F2937" stroke-width="1.5"/>
        
        <!-- Glowing Optical Sensors -->
        <g filter="url(#botEyeGlow)">
            <polygon points="96,98 114,98 111,108 98,108" fill="url(#botCoreOrange)"/>
            <polygon points="126,98 144,98 141,108 128,108" fill="url(#botCoreOrange)"/>
            <circle cx="105" cy="103" r="2.5" fill="#FFFFFF"/>
            <circle cx="135" cy="103" r="2.5" fill="#FFFFFF"/>
        </g>

        <!-- Chin Grille & Audio Speaker Vents -->
        <path d="M106 126 L134 126 L130 144 L110 144 Z" fill="#0C0E14" stroke="#2B3245" stroke-width="1"/>
        <line x1="112" y1="132" x2="128" y2="132" stroke="#4B5563" stroke-width="1.5"/>
        <line x1="114" y1="138" x2="126" y2="138" stroke="#4B5563" stroke-width="1.5"/>

        <!-- Side Antenna / Sensor Earbuds -->
        <rect x="58" y="78" width="10" height="30" rx="3" fill="#1F2937" stroke="#4B5563" stroke-width="1"/>
        <rect x="172" y="78" width="10" height="30" rx="3" fill="#1F2937" stroke="#4B5563" stroke-width="1"/>
        <line x1="63" y1="78" x2="63" y2="58" stroke="#FF5500" stroke-width="2"/>
        <circle cx="63" cy="56" r="3" fill="#FF5500"/>
    </g>

    <!-- Bottom Decal -->
    <rect x="80" y="210" width="80" height="18" rx="4" fill="#0A0D14" stroke="#222C3E" stroke-width="1"/>
    <text x="120" y="222" fill="#FF5500" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle" letter-spacing="1">RIVL-AI • 1020 ELO</text>
</svg>
